name: Build & Release Installers

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SparxSolver-Installer-linux
            asset_pattern: "installer/dist/SparxSolver-Installer*"
          - os: windows-latest
            artifact_name: SparxSolver-Installer-windows
            asset_pattern: "installer/dist/SparxSolver-Installer.exe"
          - os: macos-latest
            artifact_name: SparxSolver-Installer-macos
            asset_pattern: "installer/dist/SparxSolver-Installer*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies & Build Bundles
        run: |
          npm ci
          npm run build:all

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow

      - name: Run Build Executable Script
        run: |
          python build-installer-exe.py

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_pattern }}
          if-no-files-found: error
